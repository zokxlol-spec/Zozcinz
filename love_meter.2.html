<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>  على السكة ودوغري بتحبيني قد اي يابت </title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#ffe4e1 0%,#ffc0cb 30%,#ffb6c1 60%,#ff9eb5 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
.decor{position:absolute;pointer-events:none;opacity:0.12;animation:float 6s ease-in-out infinite}
.decor-1{top:5%;left:5%}
.decor-2{top:15%;right:8%;animation-delay:1s}
.decor-3{bottom:20%;left:3%;animation-delay:2s}
.decor-4{bottom:10%;right:5%;animation-delay:3s}
.decor-5{top:40%;left:2%;animation-delay:1.5s}
.decor-6{top:60%;right:3%;animation-delay:2.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(5deg)}}
.card{background:rgba(255,255,255,0.45);backdrop-filter:blur(20px);border-radius:30px;padding:30px 25px;width:360px;max-width:92vw;text-align:center;box-shadow:0 8px 32px rgba(255,105,180,0.2),inset 0 1px 0 rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.5);position:relative;z-index:10}
.avatar-container{position:relative;width:120px;height:120px;margin:0 auto 15px}
.avatar-glow{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,#ff6b9d,#ff8e53,#ff6b9d);animation:rotate 3s linear infinite;opacity:0;transition:opacity 0.5s}
.avatar-glow.active{opacity:0.8}
@keyframes rotate{to{transform:rotate(360deg)}}
.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,0.8);box-shadow:0 4px 20px rgba(255,107,157,0.3);position:relative;z-index:2;background:#fff}
.sparkle{position:absolute;font-size:16px;animation:sparkle 2s ease-in-out infinite}
.sparkle-1{top:-5px;right:5px}
.sparkle-2{top:20px;right:-10px;animation-delay:0.5s}
.sparkle-3{bottom:10px;left:-5px;animation-delay:1s}
.sparkle-4{top:5px;left:0px;animation-delay:1.5s}
@keyframes sparkle{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
.title{font-size:26px;font-weight:900;color:#c75b39;margin-bottom:5px;text-shadow:1px 1px 2px rgba(0,0,0,0.1);line-height:1.4}
.heart-icon{font-size:24px;color:#c75b39;margin:5px 0;display:inline-block}
.subtitle{font-size:13px;color:#888;margin-bottom:15px;display:flex;align-items:center;justify-content:center;gap:5px}
.percentage-container{margin:15px 0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.percentage{font-size:52px;font-weight:900;color:#c75b39;line-height:1;transition:all 0.3s;display:flex;align-items:center;gap:2px}
.percentage.pulse{animation:pulse 0.3s ease}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.percent-sign{font-size:28px;font-weight:700}
.status-text{font-size:14px;color:#666;margin-top:8px;min-height:24px;font-weight:600}
.question-mark{font-size:60px;color:#ddd;opacity:0.5}

/* ===== BUTTONS GRID ===== */
.buttons-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;padding:0 5px}
.pct-btn{background:rgba(255,255,255,0.6);border:2px solid rgba(255,255,255,0.8);border-radius:50%;width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800;color:#c75b39;cursor:pointer;transition:all 0.3s;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin:0 auto}
.pct-btn:hover{transform:scale(1.1);background:rgba(255,255,255,0.9);box-shadow:0 4px 15px rgba(255,107,107,0.3)}
.pct-btn.active{background:linear-gradient(135deg,#ff8e8e,#ff6b6b);color:white;border-color:#ff6b6b;transform:scale(1.15);box-shadow:0 4px 20px rgba(255,107,107,0.4)}
.pct-btn.special{grid-column:span 2;width:126px;border-radius:30px;font-size:15px}

/* Progress bar */
.progress-bar{width:100%;height:8px;background:rgba(255,255,255,0.5);border-radius:10px;margin:15px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ff8e8e,#ff6b6b);border-radius:10px;width:0%;transition:width 0.5s ease}

/* Emoji row */
.emoji-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:0 10px;font-size:20px}
.emoji-row span{transition:transform 0.3s;opacity:0.5}
.emoji-row span.active{transform:scale(1.3);opacity:1}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.4s}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:rgba(30,30,40,0.9);backdrop-filter:blur(20px);border-radius:24px;padding:25px;width:320px;max-width:90vw;text-align:center;transform:scale(0.8) translateY(20px);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal-overlay.active .modal{transform:scale(1) translateY(0)}
.modal-image{width:100%;height:200px;object-fit:cover;border-radius:16px;margin-bottom:15px;box-shadow:0 0 30px rgba(255,107,107,0.3)}
.modal-text{color:white;font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.5}
.modal-subtext{color:rgba(255,255,255,0.7);font-size:13px;margin-bottom:20px}
.modal-btn{background:linear-gradient(135deg,#ff8e8e,#ff6b6b);color:white;border:none;padding:12px 35px;border-radius:25px;font-size:15px;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;box-shadow:0 4px 20px rgba(255,107,107,0.4);transition:transform 0.2s,box-shadow 0.2s}
.modal-btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(255,107,107,0.5)}
.confetti{position:fixed;pointer-events:none;z-index:999}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
@media(max-width:400px){.card{width:95vw;padding:20px 15px}.title{font-size:22px}.percentage{font-size:44px}.pct-btn{width:50px;height:50px;font-size:12px}}
</style>
<base target="_blank">
</head>
<body>

<!-- ===== BACKGROUND DECORATIONS (ghost images floating) ===== -->
<!-- استبدل "ghost.png" بصورة الشبح اللي عندك -->
<img src="ghost.png" class="decor decor-1" style="width:80px" alt="">
<img src="ghost.png" class="decor decor-2" style="width:60px;transform:scaleX(-1)" alt="">
<img src="ghost.png" class="decor decor-3" style="width:70px" alt="">
<img src="ghost.png" class="decor decor-4" style="width:50px;transform:scaleX(-1)" alt="">
<img src="ghost.png" class="decor decor-5" style="width:45px" alt="">
<img src="ghost.png" class="decor decor-6" style="width:55px;transform:scaleX(-1)" alt="">

<!-- ===== MAIN CARD ===== -->
<div class="card">

  <!-- AVATAR (الصورة الرئيسية اللي فوق) -->
  <div class="avatar-container">
    <div class="avatar-glow" id="avatarGlow"></div>
    <!-- استبدل "avatar.png" بصورة الراجل اللي فوق -->
    <img src="avatar.png" class="avatar" id="avatar" alt="avatar">
    <span class="sparkle sparkle-1">✨</span>
    <span class="sparkle sparkle-2">⭐</span>
    <span class="sparkle sparkle-3">💫</span>
    <span class="sparkle sparkle-4">✨</span>
  </div>

  <!-- TITLE -->
  <div class="title">اسراء على السكة ودوغري <br>بتحبيني قد اي يابت</div>
  <div class="heart-icon">🤎</div>
  <div class="subtitle"><span>💉</span><span>قولي الصراحة متخافيش</span></div>

  <!-- PERCENTAGE DISPLAY -->
  <div class="percentage-container">
    <div class="question-mark" id="questionMark">؟</div>
    <div class="percentage" id="percentage" style="display:none">
      <span class="percent-sign">%</span><span id="percentValue">0</span>
    </div>
    <div class="status-text" id="statusText"></div>
  </div>

  <!-- PROGRESS BAR -->
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <!-- EMOJI ROW -->
  <div class="emoji-row">
    <span id="emojiCold">🥶</span>
    <span id="emojiSad">🥺</span>
    <span id="emojiWhite">🤍</span>
    <span id="emojiHeart">❤️</span>
    <span id="emoji100">💯</span>
  </div>

  <!-- ===== PERCENTAGE BUTTONS ===== -->
  <!-- كل زرار لما تضغط عليه بيظهر صورة وكلام مختلف -->
  <div class="buttons-grid">
    <button class="pct-btn" onclick="selectPercent(0)">0%</button>
    <button class="pct-btn" onclick="selectPercent(10)">10%</button>
    <button class="pct-btn" onclick="selectPercent(20)">20%</button>
    <button class="pct-btn" onclick="selectPercent(30)">30%</button>
    <button class="pct-btn" onclick="selectPercent(40)">40%</button>
    <button class="pct-btn" onclick="selectPercent(50)">50%</button>
    <button class="pct-btn" onclick="selectPercent(60)">60%</button>
    <button class="pct-btn" onclick="selectPercent(70)">70%</button>
    <button class="pct-btn" onclick="selectPercent(80)">80%</button>
    <button class="pct-btn" onclick="selectPercent(90)">90%</button>
    <button class="pct-btn special" onclick="selectPercent(100)">100%</button>
  </div>
</div>

<!-- ===== MODAL / POPUP ===== -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <img class="modal-image" id="modalImage" src="" alt="">
    <div class="modal-text" id="modalText"></div>
    <div class="modal-subtext" id="modalSubtext"></div>
    <button class="modal-btn" id="modalBtn" onclick="closeModal()">تمام مشتار صح 😂</button>
  </div>
</div>

<script>
// ===== GET ELEMENTS =====
const percentValue = document.getElementById('percentValue');
const percentage = document.getElementById('percentage');
const questionMark = document.getElementById('questionMark');
const statusText = document.getElementById('statusText');
const avatarGlow = document.getElementById('avatarGlow');
const progressFill = document.getElementById('progressFill');
const modal = document.getElementById('modal');
const modalImage = document.getElementById('modalImage');
const modalText = document.getElementById('modalText');
const modalSubtext = document.getElementById('modalSubtext');
const modalBtn = document.getElementById('modalBtn');

// ===== BUTTON DATA =====
// هنا بتحط الصور والكلام لكل نسبة
// استبدل "image1.jpg" بأسماء الصور اللي عندك
const buttonData = {
  0:   {image:"image1.jpg", text:"جربي تاني بسرعة قبل ما ألغيها! 🔪", subtext:"", btn:"تمام هختار صح ✨😂"},
  10:  {image:"image2.jpg", text:"هديكي فرصة كمان تصلحي غلطتك 🌷", subtext:"", btn:"تمام هختار صح ✔️"},
  20:  {image:"image3.jpg", text:"اللهم طولك يا روح متوديني في داهية! 🔪", subtext:"فوقي حرام الملامح البريئة دي تتشوه", btn:"تمام هختار صح 😂"},
  30:  {image:"image4.jpg", text:"أنا اعمل إيه تاني؟! 😂", subtext:"حبيني شويه كمان", btn:"تمام هختار صح 😂"},
  40:  {image:"image5.jpg", text:"بدأت أشك في العلاقة 😐", subtext:"", btn:"تمام 😂"},
  50:  {image:"image6.jpg", text:"دخول جذاب لدرجة العذاب 😎", subtext:"", btn:"تمام 😂"},
  60:  {image:"image7.jpg", text:"أيوه كده بقى~ 😏", subtext:"فاضل حبه شايلاهم فين 💕", btn:"تمام مكمل ✔️"},
  70:  {image:"image8.jpg", text:"بدا يتحسن الحال! 🎉", subtext:"", btn:"تمام 😂"},
  80:  {image:"image9.jpg", text:"أيوه كده! 🔥", subtext:"", btn:"تمام ✔️"},
  90:  {image:"image10.jpg", text:"قربنا! كمان شوية 💪", subtext:"", btn:"تمام 😂"},
  100: {image:"image11.jpg", text:"أنا أكتر 😏", subtext:"وصلنا! 💯🌹", btn:"✨😏"}
};

// ===== STATUS MESSAGES =====
// الكلام اللي بيظهر تحت النسبة
const statusMessages = {
  0: "", 
  10: "ده مش حب ده شفقة يا إسراء😂",
  20: "هوا لو بتحبيني متوسط...",
  30: "ممكن تزوديها شوية؟",
  40: "قريبة بس لسه مش كفاية",
  50: "نص بنص؟ ده مش عدل خالص",
  60: "قولي الصراحة 😐",
  70: "ماشي ماشي... بس لسه ناقص",
  80: "بدا يتحسن الحال!",
  90: "أيوه كده!",
  100: "ده اللي كنت عارفه أول كلام 😏"
};

let currentPercent = -1;

// ===== SELECT PERCENT FUNCTION =====
// دي اللي بتشتغل لما تضغط على أي زرار
function selectPercent(pct) {
  currentPercent = pct;

  // Update percentage display
  if (pct === 0) {
    questionMark.style.display = 'block';
    percentage.style.display = 'none';
    avatarGlow.classList.remove('active');
  } else {
    questionMark.style.display = 'none';
    percentage.style.display = 'flex';
    percentValue.textContent = pct;
    percentage.classList.add('pulse');
    setTimeout(() => percentage.classList.remove('pulse'), 300);

    if (pct >= 70) avatarGlow.classList.add('active');
    else avatarGlow.classList.remove('active');
  }

  // Update progress bar
  progressFill.style.width = pct + '%';

  // Update status text
  statusText.textContent = statusMessages[pct] || '';

  // Update active button (highlight the clicked button)
  document.querySelectorAll('.pct-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  // Update active emoji
  document.querySelectorAll('.emoji-row span').forEach(e => e.classList.remove('active'));
  if (pct >= 90) document.getElementById('emoji100').classList.add('active');
  else if (pct >= 70) document.getElementById('emojiHeart').classList.add('active');
  else if (pct >= 50) document.getElementById('emojiWhite').classList.add('active');
  else if (pct >= 25) document.getElementById('emojiSad').classList.add('active');
  else if (pct > 0) document.getElementById('emojiCold').classList.add('active');

  // Show modal with image and text
  showModal(buttonData[pct]);
}

// ===== SHOW MODAL =====
function showModal(data) {
  modalImage.src = data.image;
  modalText.textContent = data.text;
  modalSubtext.textContent = data.subtext || '';
  modalBtn.textContent = data.btn;
  modal.classList.add('active');

  // Confetti effect for 100%
  if (currentPercent === 100) createConfetti();
}

// ===== CLOSE MODAL =====
function closeModal() {
  modal.classList.remove('active');
}

// ===== CONFETTI EFFECT =====
function createConfetti() {
  const colors = ['#ff6b6b','#ff8e8e','#ffd93d','#6bcf7f','#4d96ff','#ff6b9d'];
  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-10px';
      c.style.width = (8 + Math.random() * 6) + 'px';
      c.style.height = (8 + Math.random() * 6) + 'px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
      c.style.animation = 'fall ' + (2 + Math.random() * 3) + 's linear forwards';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }, i * 50);
  }
}

// Close modal when clicking outside
modal.addEventListener('click', (e) => { 
  if (e.target === modal) closeModal(); 
});
</script>
</body>
</html>
